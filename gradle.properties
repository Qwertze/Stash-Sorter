plugin_version=1.2.0
plugin_name=StashSorter
plugin_id=qwerte-stash
# MC version of AquariusProxy this plugin is compiled for
mc=1.21.4
maven_group=com.porter.qwertestash

# Path to the AquariusProxy jar to compile against (the same jar the launcher runs).
# Leave unset to use ./libs/AquariusProxy.jar, or pass -Paquarius_jar=/path/to/AquariusProxy.jar
#aquarius_jar=

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
